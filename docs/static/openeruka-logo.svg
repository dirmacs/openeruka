<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c8ebf"/>
      <stop offset="100%" style="stop-color:#4a6fa5"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" stroke="url(#ring)" stroke-width="3"/>
  <!-- Central hub node -->
  <circle cx="64" cy="64" r="7" fill="#6c8ebf"/>
  <!-- Knowledge state nodes (outer ring) -->
  <circle cx="64" cy="36" r="5" fill="#10b981"/> <!-- CONFIRMED top -->
  <circle cx="90" cy="54" r="5" fill="#eab308"/> <!-- INFERRED right -->
  <circle cx="80" cy="86" r="5" fill="#8b5cf6"/> <!-- UNCERTAIN bottom-right -->
  <circle cx="44" cy="86" r="5" fill="#ef4444"/> <!-- UNKNOWN bottom-left -->
  <circle cx="38" cy="54" r="5" fill="#6c8ebf"/> <!-- hub-level left -->
  <!-- Edges from center -->
  <line x1="64" y1="57" x2="64" y2="41" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
  <line x1="70" y1="59" x2="85" y2="57" stroke="#eab308" stroke-width="1.5" opacity="0.7"/>
  <line x1="68" y1="69" x2="76" y2="81" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>
  <line x1="58" y1="69" x2="48" y2="81" stroke="#ef4444" stroke-width="1.5" opacity="0.7"/>
  <line x1="57" y1="59" x2="43" y2="57" stroke="#6c8ebf" stroke-width="1.5" opacity="0.7"/>
  <!-- Outer ring arc (open = OSS) -->
  <path d="M 24 64 A 40 40 0 1 1 104 64" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="4 3" opacity="0.4"/>
</svg>
