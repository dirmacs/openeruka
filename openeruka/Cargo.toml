[package]
name = "openeruka"
description = "Self-hosted knowledge state memory server for AI agents — types, client, SQLite backend, REST API, MCP"
keywords = ["memory", "context", "knowledge-graph", "ai-agent", "eruka"]
categories = ["data-structures", "api-bindings"]
readme = "../README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "openeruka"
path = "src/lib.rs"

[[bin]]
name = "openeruka"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

# Server deps (behind "server" feature)
tokio = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
redb = { version = "2", optional = true }

[features]
default = ["server"]
server = ["dep:tokio", "dep:axum", "dep:rusqlite", "dep:clap", "dep:tracing", "dep:tracing-subscriber", "dep:anyhow"]
redb = ["dep:redb", "server"]
test-helpers = []

[dev-dependencies]
